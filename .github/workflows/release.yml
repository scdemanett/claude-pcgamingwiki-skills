name: Package skills

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and pack skills
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            file="$dir/SKILL.md"
            [ -f "$file" ] || { echo "::error::$name is missing SKILL.md"; exit 1; }
            fm_name=$(awk '/^---$/{n++; next} n==1 && /^name:/{sub(/^name:[ ]*/,""); gsub(/"/,""); print; exit}' "$file")
            [ "$fm_name" = "$name" ] || { echo "::error file=$file::frontmatter name '$fm_name' does not match folder '$name'"; exit 1; }
            grep -q '^description:' "$file" || { echo "::error file=$file::missing description"; exit 1; }
            (cd skills && zip -qr "../dist/$name.skill" "$name" -x '*.DS_Store')
            echo "Packed $name.skill"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.skill

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.skill --clobber
          else
            gh release create "$TAG" dist/*.skill --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
